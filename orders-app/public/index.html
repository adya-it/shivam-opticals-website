<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shivam Opticals - Orders</title>
<style>
  :root {
    --blue: #1d5fae;
    --green: #1f8a52;
    --amber: #b8780a;
    --gray-bg: #f4f6f8;
    --card-bg: #ffffff;
    --border: #dfe3e8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--gray-bg);
    color: #1c2530;
  }
  header {
    background: var(--blue);
    color: white;
    padding: 14px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; }
  select#branchSelect {
    font-size: 15px;
    padding: 8px 10px;
    border-radius: 6px;
    border: none;
  }
  main { max-width: 720px; margin: 0 auto; padding: 14px; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .card h2 { margin: 0 0 10px; font-size: 16px; }
  label { display: block; font-size: 13px; color: #556; margin: 8px 0 3px; }
  input[type=text], input[type=tel] {
    width: 100%;
    padding: 10px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .eye-label { font-weight: 600; font-size: 13px; margin-top: 10px; color: var(--blue); }
  button {
    cursor: pointer;
    border: none;
    border-radius: 7px;
    font-size: 15px;
    padding: 11px 14px;
    font-weight: 600;
  }
  .btn-primary { background: var(--blue); color: white; width: 100%; margin-top: 12px; }
  .btn-ready { background: var(--amber); color: white; }
  .btn-collect { background: var(--green); color: white; }
  .btn-delete { background: #c0392b; color: white; font-size: 13px; padding: 7px 10px; }
  .order {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
    background: #fafbfc;
  }
  .order .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .order .name { font-weight: 700; font-size: 15px; }
  .order .meta { font-size: 12px; color: #667; margin-top: 2px; }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 12px;
    font-weight: 600;
  }
  .badge.placed { background: #fde8c8; color: #8a5b00; }
  .badge.ready { background: #fff0cf; color: var(--amber); }
  .badge.collected { background: #d9f2e3; color: var(--green); }
  .actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .rx-summary { font-size: 12px; color: #445; margin-top: 6px; white-space: pre-line; }
  .section-title { font-size: 14px; font-weight: 700; margin: 18px 0 8px; color: #334; }
  .empty { color: #889; font-size: 13px; padding: 8px 0; }
  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #222; color: white; padding: 10px 16px; border-radius: 8px;
    font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>👓 Shivam Opticals - Orders</h1>
  <select id="branchSelect"></select>
</header>

<main>
  <div class="card" id="newOrderCard">
    <h2>New Order</h2>
    <form id="orderForm">
      <label>Customer Name</label>
      <input type="text" id="customerName" required />

      <label>Contact Number (WhatsApp)</label>
      <input type="tel" id="phone" placeholder="98765 43210" required />

      <div class="grid2">
        <div>
          <div class="eye-label">Right Eye</div>
          <label>SPH</label><input type="text" id="r_sph" />
          <label>CYL</label><input type="text" id="r_cyl" />
          <label>AXIS</label><input type="text" id="r_axis" />
        </div>
        <div>
          <div class="eye-label">Left Eye</div>
          <label>SPH</label><input type="text" id="l_sph" />
          <label>CYL</label><input type="text" id="l_cyl" />
          <label>AXIS</label><input type="text" id="l_axis" />
        </div>
      </div>
      <div class="grid2">
        <div>
          <label>ADD</label>
          <input type="text" id="add" />
        </div>
        <div>
          <label>PD</label>
          <input type="text" id="pd" />
        </div>
      </div>

      <button type="submit" class="btn-primary">Place Order &amp; Notify Customer</button>
    </form>
  </div>

  <div class="section-title">⏳ Pending (not yet ready)</div>
  <div id="pendingList" class="card"></div>

  <div class="section-title">📦 Ready for Pickup</div>
  <div id="readyList" class="card"></div>

  <div class="section-title">✅ Collected (recent)</div>
  <div id="collectedList" class="card"></div>
</main>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
